databases:
  - name: whale-tracker-db
    databaseName: whale_tracker
    user: whale_user
    plan: free

services:
  # ── Backend (Node.js / Express + Socket.IO) ──────────────────────────────
  - type: web
    name: whale-tracker-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALCHEMY_API_KEY
        sync: false          # Required — set in Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: whale-tracker-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false          # Set to your frontend URL after first deploy

  # ── Frontend (Vite / React → static files) ───────────────────────────────
  - type: web
    name: whale-tracker-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND_URL
        sync: false          # Set to your backend URL before building
